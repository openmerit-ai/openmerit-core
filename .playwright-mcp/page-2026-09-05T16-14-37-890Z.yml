      - heading [level=2] [ref=f1e255]:
        - text: A leaderboard can tell youwhich model is impressive.
        - generic [ref=f1e256]: We tell you which onebelongs in your product.
      - generic [ref=f1e257]:
        - article [ref=f1e258]:
          - text: 01 / Define
          - heading "Start with the job." [level=3] [ref=f1e259]
          - paragraph [ref=f1e260]: Describe the job, hard requirements, and costly failures. Define scorers and representative cases in a portable .eval.md file.
        - article [ref=f1e261]:
          - text: 02 / Compare
          - heading "Test what matters." [level=3] [ref=f1e262]
          - paragraph [ref=f1e263]: Find plausible models and configurations within your privacy, licensing, and deployment limits. Benchmark them with your own runner.
        - article [ref=f1e264]:
          - text: 03 / Decide
          - heading "Keep the reasoning." [level=3] [ref=f1e265]
          - paragraph [ref=f1e266]: Compare qualified options on quality, cost, and latency. Keep a record of the tradeoffs, confidence, and rejected alternatives—even when the answer is to wait.
