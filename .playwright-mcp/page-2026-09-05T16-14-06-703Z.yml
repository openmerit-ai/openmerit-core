      - paragraph [ref=e169]: THE DECISION LAYER BETWEEN MODELS AND APPLICATIONS
      - heading [level=2] [ref=e170]:
        - text: A leaderboard can tell youwhich model is impressive.
        - generic [ref=e171]: We tell you which onebelongs in your product.
      - generic [ref=e172]:
        - article [ref=e173]:
          - text: 01 / Define
          - heading "Start with the job." [level=3] [ref=e174]
          - paragraph [ref=e175]: Describe the job, hard requirements, and costly failures. Define scorers and representative cases in a portable .eval.md file.
        - article [ref=e176]:
          - text: 02 / Compare
          - heading "Test what matters." [level=3] [ref=e177]
          - paragraph [ref=e178]: Find plausible models and configurations within your privacy, licensing, and deployment limits. Benchmark them with your own runner.
        - article [ref=e179]:
          - text: 03 / Decide
          - heading "Keep the reasoning." [level=3] [ref=e180]
          - paragraph [ref=e181]: Compare qualified options on quality, cost, and latency. Keep a record of the tradeoffs, confidence, and rejected alternatives—even when the answer is to wait.
