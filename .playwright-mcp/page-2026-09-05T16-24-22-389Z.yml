      - heading [level=2] [ref=f3e249]:
        - text: A leaderboard can tell youwhich model is impressive.
        - generic [ref=f3e250]: We tell you which onebelongs in your product.
      - generic [ref=f3e251]:
        - article [ref=f3e252]:
          - text: 01 / Define
          - heading "Start with the job." [level=3] [ref=f3e253]
          - paragraph [ref=f3e254]: Describe the job, hard requirements, and costly failures. Define scorers and representative cases in a portable .eval.md file.
        - article [ref=f3e255]:
          - text: 02 / Compare
          - heading "Test what matters." [level=3] [ref=f3e256]
          - paragraph [ref=f3e257]: Find plausible models and configurations within your privacy, licensing, and deployment limits. Benchmark them with your own runner.
        - article [ref=f3e258]:
          - text: 03 / Decide
          - heading "Keep the reasoning." [level=3] [ref=f3e259]
          - paragraph [ref=f3e260]: Compare qualified options on quality, cost, and latency. Keep a record of the tradeoffs, confidence, and rejected alternatives—even when the answer is to wait.
