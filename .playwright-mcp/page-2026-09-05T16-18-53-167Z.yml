      - generic [ref=f2e242]:
        - article [ref=f2e243]:
          - text: 01 / Define
          - heading "Start with the job." [level=3] [ref=f2e244]
          - paragraph [ref=f2e245]: Describe the job, hard requirements, and costly failures. Define scorers and representative cases in a portable .eval.md file.
        - article [ref=f2e246]:
          - text: 02 / Compare
          - heading "Test what matters." [level=3] [ref=f2e247]
          - paragraph [ref=f2e248]: Find plausible models and configurations within your privacy, licensing, and deployment limits. Benchmark them with your own runner.
        - article [ref=f2e249]:
          - text: 03 / Decide
          - heading "Keep the reasoning." [level=3] [ref=f2e250]
          - paragraph [ref=f2e251]: Compare qualified options on quality, cost, and latency. Keep a record of the tradeoffs, confidence, and rejected alternatives—even when the answer is to wait.
