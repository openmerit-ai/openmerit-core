name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by merge-when-green.yml, whose GITHUB_TOKEN merges trigger no push run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run verify

  # Separate job so the slow `wrangler types --check` runs in parallel with verify.
  worker-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run check:worker-types

  # The Sahra Health customer playground: its own lockfile, the published openmerit package, no
  # model calls. Kept out of `npm run verify`.
  playground:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci
      - run: npm run check

  # The cloud app behind openmerit.ai/mcp: its own lockfile, typecheck, and tests against a local
  # Rivet engine with fake sign-in, billing and models (no paid calls), then its Docker image.
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: docker build -f cloud/Dockerfile -t openmerit-cloud:ci .
        working-directory: .

  # The openmerit npm package: its own lockfile, typecheck, tests and build. No model calls.
  openmerit-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openmerit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: openmerit-core/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # The packed openmerit tarball installed globally with an empty npm cache, as users get it, on
  # every platform with a Rivet engine binary: connect, setup, scout, history and MCP against a
  # local fake model endpoint. On Linux arm64 and Apple silicon also the daemon test, which SIGKILLs
  # the daemon at every question: the openmerit-core job runs it on Linux x64. No model calls.
  # The Intel Mac job runs x64 Node under Rosetta 2 on Apple silicon, so npm installs the darwin-x64
  # engine and rivetkit-napi binaries, as on an Intel Mac. Keep these jobs on GitHub-hosted runners:
  # the repository is public, so pull requests from forks run this workflow.
  openmerit-packed:
    name: openmerit-packed (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            daemon: true
          - platform: darwin-arm64
            runner: macos-latest
            daemon: true
          - platform: darwin-x64
            runner: macos-latest
            node-arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: openmerit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          architecture: ${{ matrix.node-arch }}
          cache: npm
          cache-dependency-path: openmerit-core/package-lock.json
      # Fails instead of testing the wrong binaries if the runner did not give the expected platform.
      - run: node -e 'const p = `${process.platform}-${process.arch}`; if (p !== process.argv[1]) throw new Error(`expected ${process.argv[1]}, got ${p}`)' '${{ matrix.platform }}'
      - run: npm ci
      - run: node scripts/smoke-packed.ts
      - if: matrix.daemon
        run: node --test test/daemon.test.ts
