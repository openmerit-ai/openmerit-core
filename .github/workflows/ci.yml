name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run check

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Pack and install the public artifact
        shell: bash
        run: |
          package_file="$(npm pack --silent)"
          package_root="$(mktemp -d)"
          state_root="$(mktemp -d)"
          npm install --prefix "$package_root" "./$package_file"
          installed="$package_root/node_modules/openmerit"
          node "$installed/dist/cli.js" --help
          OPENMERIT_HOME="$state_root" node "$installed/dist/cli.js" init
          test -f "$installed/extension/openmerit.ts"
          test -f "$installed/instructions/openmerit.policy.json"
          test -f "$installed/benchmark/invoice_ocr/data/manifest.json"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(p.mode!=="recommend"||p.auto_apply.enabled!==false)process.exit(1)' "$state_root/policy.json"
          node --input-type=module -e 'import{readFileSync}from"node:fs";import{pathToFileURL}from"node:url";const r=process.argv[1];const{knownInvoiceScore}=await import(pathToFileURL(`${r}/dist/invoice-eval.js`));const task=readFileSync(`${r}/examples/invoice-prompt.txt`,"utf8");const data=readFileSync(`${r}/benchmark/invoice_ocr/data/invoice_01_row_2.jpg`).toString("base64");const answer=readFileSync(`${r}/benchmark/invoice_ocr/data/invoice_01_ground_truth.json`,"utf8");const result=await knownInvoiceScore(task,[{mimeType:"image/jpeg",data}],answer);if(result?.score!==1)process.exit(1)' "$installed"
