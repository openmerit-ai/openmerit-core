name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by merge-when-green.yml, whose GITHUB_TOKEN merges trigger no push run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run verify

  # Separate job so the slow `wrangler types --check` runs in parallel with verify.
  worker-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run check:worker-types

  # The Sahra Health customer playground: its own lockfile, the published openmerit package, no
  # model calls. Kept out of `npm run verify`.
  playground:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci
      - run: npm run check

  # The server behind openmerit.ai/mcp (openmerit-core/src/server): typecheck and its tests against a local
  # Rivet engine with fake sign-in, billing and models (no paid calls), then the hosted Docker image.
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: openmerit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            cloud/package-lock.json
            openmerit-core/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:server
      # The deploy script.
      - run: npm ci && npm run check
        working-directory: cloud
      - run: docker build -f cloud/Dockerfile -t openmerit-cloud:ci .
        working-directory: .
      # The image holds only the openmerit-core sources the server imports: load every module it serves from.
      - run: docker run --rm openmerit-cloud:ci node --input-type=module -e "await import('./app.ts')"
        working-directory: .

  # The openmerit npm package: its own lockfile, typecheck, tests and build. No model calls.
  openmerit-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openmerit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            openmerit-core/package-lock.json
      # The build bundles the web app (app/), with the website's packages, into dist/web for the self-hosted server.
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # The packed openmerit tarball installed globally with an empty npm cache, as users get it, on
  # Linux x64 and arm64: connect, setup, scout, history and MCP against a local fake model endpoint.
  # On Linux arm64 also the daemon test, which SIGKILLs the daemon at every question: the
  # openmerit-core job runs it on Linux x64. No model calls. Macs are not tested for now: GitHub's
  # macOS runners stopped picking up jobs and blocked merges and deploys. Keep these jobs on GitHub-hosted runners:
  # the repository is public, so pull requests from forks run this workflow.
  openmerit-packed:
    name: openmerit-packed (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            daemon: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: openmerit-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            openmerit-core/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: .
      # Fails instead of testing the wrong binaries if the runner did not give the expected platform.
      - run: node -e 'const p = `${process.platform}-${process.arch}`; if (p !== process.argv[1]) throw new Error(`expected ${process.argv[1]}, got ${p}`)' '${{ matrix.platform }}'
      - run: npm ci
      - run: node scripts/smoke-packed.ts
      - if: matrix.daemon
        run: node --test test/daemon.test.ts
